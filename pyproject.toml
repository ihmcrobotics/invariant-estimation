[project]
name = "invariant_estimation"
version = "0.0.1"
requires-python = ">= 3.12"
description = "Invariant Estimation for a Humanoid Robot in JAX"
authors = [
  { name = "Lucas Libshutz", email = "llibshutz@ihmc.org"},
  { name = "Beomyeong Park", email = "bpark@ihmc.org"},
]

dependencies = [
  "jax",
  "jaxlie",
  "ipython"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
