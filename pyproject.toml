[project]
name = "invariant_estimation"
version = "0.0.1"
requires-python = ">= 3.12"
description = "Invariant Estimation for a Humanoid Robot in JAX"
authors = [
  { name = "Lucas Libshutz", email = "llibshutz@ihmc.org"},
  { name = "Beomyeong Park", email = "bpark@ihmc.org"},
]

dependencies = [
  "jax",
  "jaxlie",
  "ipython",
  "pyyaml",
  "ruff",
  "black",
  "mujoco>=3.10.0",
  "mujoco-mjx>=3.10.0",
  # run_policy.py runs the exported RL policies (assets/rl_models/*.onnx) on CPU. Not used by the
  # estimator itself, but a hard requirement of the sim entry point, so it stays a main dependency.
  "onnxruntime>=1.20",
  # contactnet/train.py only. The ContactNet forward pass is hand-written (it is transliterated
  # into Java per network_plan.md §7); optax supplies just the training-time optimizer chain,
  # which never leaves Python.
  "optax>=0.2.8",
]

[project.scripts]
docs = "invariant_estimation._docs:serve"
docs-build = "invariant_estimation._docs:build"
gen-stubs = "invariant_estimation._stubs:main"

[dependency-groups]
# zstandard decodes robotData.bsz for the Java-parity harness (replay/logsource.py).
# Dev-only: the estimator itself never reads a log.
dev = ["pytest", "zstandard"]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/sim/` drives the real sim entry points, which live at the repo root as scripts
# (`run_policy.py`, `run_estimator.py`) rather than inside the package.
pythonpath = ["."]
markers = ["slow: builds the full Alex estimator (~1 min of MJX tracing per module)"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["E401", "E402", "F401", "E702"]
